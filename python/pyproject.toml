[project]
name = "trybunx-clip-hunter-worker"
version = "0.1.0"
description = "OCR analysis worker for TrybunaTV AI Clip Hunter"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.23,<2",
    "pytesseract>=0.3.10,<0.4",
    "rapidocr>=3.9,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
tracking = ["ultralytics==8.4.146"]

[tool.uv]
# The worker is a plain script, not an installable package.
package = false
