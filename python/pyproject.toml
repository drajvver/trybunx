[project]
name = "trybunx-clip-hunter-worker"
version = "0.1.0"
description = "OCR analysis worker for TrybunaTV AI Clip Hunter"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8,<6",
    "pytesseract>=0.3.10,<0.4",
    "numpy>=1.26,<3",
]

[tool.uv]
# The worker is a plain script, not an installable package.
package = false
