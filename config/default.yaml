# TrybunaTV AI Clip Hunter - default configuration (PRD section 26)
# All detection thresholds and timing parameters can be tuned here without
# touching application source code.

analysis:
  ocr_interval_ms: 1000          # coarse scoreboard sampling interval
  fine_ocr_interval_ms: 200      # fine scan sampling around candidate changes
  fine_scan_margin_seconds: 2    # extra context around a candidate window
  event_window_seconds: 8        # signal clustering window
  refine_change_times: true      # use fine scans to refine change timestamps
  decode_acceleration: auto      # auto benchmarks VideoToolbox on macOS | videotoolbox | software

ocr:
  engine: neural                  # neural (RapidOCR/ONNX) | tesseract
  provider: auto                  # auto | coreml | cpu (CUDA can be added later)
  fallback_to_tesseract: false    # opt-in legacy fallback; slower on unreadable frames
  change_detection_enabled: true # reuse OCR while the score crop is visually unchanged
  change_threshold: 2.0          # mean 8-bit pixel difference after downsampling
  refresh_interval_seconds: 30   # force a neural read periodically even without change
  confirmation_reads: 3          # repeated reads required to accept a score
  confirmation_window_seconds: 3 # reads must happen within this window
  upscale: 3                     # ROI upscale factor applied by ffmpeg
  min_confidence: 0.35           # discard OCR reads below this confidence
  max_reasonable_score: 30       # scores above this are treated as OCR noise
  worker_batch_size: 64          # frames per Python worker request

audio:
  enabled: true
  sample_rate: 16000             # analysis audio: 16 kHz mono PCM
  rms_window_ms: 200             # analysis window size
  baseline_seconds: 10           # rolling baseline length
  spike_threshold_db: 8.0        # delta above baseline that counts as a spike
  spike_cooldown_seconds: 1.5    # minimum spacing between reported spikes
  silence_floor_db: -55          # ignore spikes below this absolute level

goal_detection:
  audio_lookback_seconds: 12     # search audio this far before a score change
  fallback_offset_seconds: 4     # event_time = change_time - offset when no peak
  dedup_seconds: 20              # dedup window for identical transitions
  peak_metric: rms               # rms | delta - metric for strongest peak
  strong_spike_threshold_db: 8.0 # peak must exceed this to refine timing
  confidence_weights:
    score_change: 0.70
    audio_spike: 0.15
    keyword: 0.10
    agreeing_signals: 0.05

clips:
  goal_pre_roll_seconds: 25
  goal_post_roll_seconds: 10
  max_clip_seconds: 35
  create_clips_for_unknown: false # UNKNOWN_INTERESTING events get no clips in v0.1
  encoding: reencode              # reencode = accurate cuts (preferred); copy = fast
  video_crf: 23
  video_preset: veryfast

# Action-following 9:16 vertical twins. One vertical clip is generated for
# every horizontal goal clip (same time window, same audio, flat `clips/`
# layout). The crop follows the main player cluster (COCO person, always
# visible on real broadcasts); the ball (COCO sports-ball) is used
# opportunistically when the model actually sees it.
# The standard model downloads automatically during the first vertical clip
# (git-ignored, ~13 MB). A custom path is resolved relative to the app folder.
vertical:
  enabled: true
  width: 1080
  height: 1920
  track_sample_fps: 6            # action position samples per second
  model_path: python/track/models/ball.onnx
  min_confidence: 0.05           # ball sightings below this are ignored (cluster still applies)
  ball_trust: 0.05               # low-confidence small-ball detections can still lead the crop
  ball_confirmation_frames: 1    # a short ball sighting still matters at the goal moment
  ball_lead_fraction: 0.25       # keep 75% of the crop toward the nearby goal
  wide_fallback_enabled: true    # preserve the full pitch when no reliable ball track exists
  person_confidence: 0.25        # person boxes below this are ignored by the cluster
  person_iou: 0.5                # NMS IoU threshold for the person pass
  cluster_top_k: 6               # tallest of the top-k person boxes is the action
  cluster_padding: 60            # padding around the player span, source pixels
  cluster_trust: 0.0             # min cluster confidence to link (0 = accept all)
  resync_after_lost_seconds: 3.0 # re-seed the track after this long lost
  smoothing_window_seconds: 0.6  # moving-average window for the crop center
  sample_fps: 6                  # tracker rate the smoothing gap detection assumes
  max_pan_speed: 1             # max crop-center travel, fraction of width per second
  lost_hold_seconds: 1.5         # hold last position after losing the action
  recenter_seconds: 1.0          # then ease back to center over this long
  video_preset: veryfast
  video_crf: 23

output:
  dir: output
