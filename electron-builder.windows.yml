extends: null
appId: tv.trybuna.clip-hunter
productName: TrybunaTV AI Clip Hunter
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Build on Windows: never ship a developer's macOS venv or native libraries.
extraResources:
  - from: .windows-build/python
    to: python
  - from: .windows-build/runtime
    to: runtime
  - from: .windows-build/bin
    to: bin
  - from: .windows-build/licenses
    to: licenses
  - from: .windows-build/runtime-build.json
    to: runtime-build.json
  - from: config
    to: config
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Trybunx-Setup-${version}-x64.exe
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Trybunx
