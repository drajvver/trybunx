extends: null
appId: tv.trybuna.clip-hunter
productName: TrybunaTV AI Clip Hunter
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: .windows-build/python
    to: python
  - from: .windows-build/runtime
    to: runtime
  - from: .windows-build/bin
    to: bin
  - from: .windows-build/licenses
    to: licenses
  - from: config
    to: config
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: Trybunx-${version}-windows-x64.${ext}
nsis:
  artifactName: Trybunx-Setup-${version}-windows-x64.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Trybunx
  installerLanguages: [pl_PL]
  language: '1045'
  displayLanguageSelector: false
